name: nur_pusulasi
description: 5 Vakit Namaz - namaz merkezli ibadet rehberi ve vakit takip uygulamasi.
publish_to: 'none'
version: 0.2.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.5
  shared_preferences: ^2.5.3
  http: ^1.6.0
  adhan_dart: ^2.0.1
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  flutter_compass: ^0.8.1
  geolocator: ^14.0.1
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  provider: ^6.1.5+1
  font_awesome_flutter: ^11.0.0
  url_launcher: ^6.3.3
  flutter_native_splash: ^2.4.8
  google_fonts: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/content/

  fonts:
    - family: Rika
      fonts:
        - asset: assets/fonts/ArefRuqaa-Regular.ttf
        - asset: assets/fonts/ArefRuqaa-Bold.ttf
          weight: 700
    - family: Matbu
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
        - asset: assets/fonts/Amiri-Italic.ttf
          style: italic


# ═══════════════════════════════════════════════════════════
# SPLASH SCREEN KONFIGURASYONU
# ═══════════════════════════════════════════════════════════
flutter_native_splash:
  color: "#0A1F44"
  color_dark: "#05132B"
  android: true
  ios: true
  web: false
  fullscreen: true
  android_12:
    color: "#0A1F44"
    color_dark: "#05132B"